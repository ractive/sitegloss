name: Release

# Pushing a tag vX.Y.Z (on a commit of main) builds four zips: the unpacked
# extension with the fixed key (for "Load unpacked"), the store package without
# it (Chrome Web Store, Microsoft Edge Add-ons), the Firefox store package
# (addons.mozilla.org, not minified) and the source archive of the built commit
# that addons.mozilla.org's reviewers rebuild that one from. Only then it
# creates the GitHub release with all four attached. So a failed build leaves
# no empty release, and published releases are never changed afterwards
# (immutable releases work).
#
#   git tag v0.1.0 <merge commit on main> && git push origin v0.1.0
#
# First the full end-to-end sets, Chromium's and Firefox's (e2e.yml, the job
# e2e, DEC-053): the build waits for them, so a red run builds and releases
# nothing. The jobs e2e and build run third-party code (bun install, the
# tests, Chrome, Firefox, ff-rdp) with a read-only token (contents read; the
# e2e jobs also attestations, for checking ff-rdp's attestation, and actions,
# which only a nightly run uses); only the release job, which runs none, may
# write.
#
# The release job also attests all four zips: a signed statement (SLSA build
# provenance, through Sigstore) that this workflow built a file with that
# digest from that commit. Whoever has a zip checks it with
#
#   gh attestation verify sitegloss-X.Y.Z.zip --repo ractive/sitegloss
#
# The jobs publish, publish-edge and publish-firefox verify it before anything
# goes to a store, so it is not optional: GitHub offers attestations in private repositories only on
# Enterprise Cloud, and in a private repository this step fails before any
# release is made.
#
# Then three jobs publish, each in its own environment (required reviewer,
# tags v* only), only a zip whose attestation verifies for this tag:
# publish uploads it to the Chrome Web Store as a CRX signed with the item's
# verified-upload key and submits it for review (ractive/release-workflows
# chrome-extension-publish.yml, DEC-032, environment chrome-web-store);
# publish-edge uploads it to Microsoft Edge Add-ons and submits it for
# certification (edge-extension-publish.yml, DEC-033, environment
# edge-add-ons); publish-firefox uploads the Firefox store zip to
# addons.mozilla.org as a new version for review, with the source archive
# attached (firefox-extension-publish.yml, DEC-035, environment
# firefox-add-ons). The tag rule serves Firefox too: a Chrome version is a valid
# Firefox version. publish.yml runs any of them by hand, for a release whose
# publish failed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Pinned as in ci.yml (test/workflows.test.ts holds every workflow to one value).
  CHROME_VERSION: "156.0.8078.80"

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      attestations: read
      actions: read

  build:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is a Chrome version on main
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Chrome takes 1 to 4 dot-separated integers from 0 to 65535, no leading zeros.
          if ! echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]{0,4})(\.(0|[1-9][0-9]{0,4})){0,3}$' \
            || ! echo "${TAG#v}" | awk -F. '{ for (i = 1; i <= NF; i++) if ($i > 65535) exit 1 }'; then
            echo "tag $TAG is not v plus a Chrome extension version"
            exit 1
          fi
          # An annotated tag's GITHUB_SHA is the tag object: peel it to its commit.
          commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main \
            || { echo "tag $TAG is not on main"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: The tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$TAG" = "v$version" || { echo "tag $TAG, package.json $version"; exit 1; }
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
      - run: bun install --frozen-lockfile
      # Biome, the type check, the unit tests and the end-to-end smoke set
      # (the full sets ran in the job e2e).
      - run: bun run verify
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: bun scripts/build.ts --zip
      - run: bun scripts/build.ts --store --zip --outdir dist-store
      - run: bun scripts/build.ts --firefox --store --zip
      - name: The source archive of the built commit (for addons.mozilla.org's reviewers)
        env:
          TAG: ${{ github.ref_name }}
          BUILT: ${{ steps.tag.outputs.commit }}
        run: |
          version="${TAG#v}"
          git archive --format=zip --prefix="sitegloss-$version/" \
            -o "sitegloss-$version-source.zip" "$BUILT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zips
          path: sitegloss-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # For the zips' attestations: an OIDC token for the signing certificate,
      # and storing the attestation and its record.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zips
      - name: The tag still points at the commit that was built
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUILT: ${{ needs.build.outputs.commit }}
        run: |
          # A tag moved since the push would get zips of another commit. This API
          # peels an annotated tag to its commit.
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)"
          test "$tagged" = "$BUILT" \
            || { echo "tag $TAG is at $tagged, this run built $BUILT"; exit 1; }
      - name: Attest the zips
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: sitegloss-*.zip
      - name: Create the release with the zips
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls sitegloss-*.zip
          gh release create "$TAG" sitegloss-*.zip --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Sitegloss ${TAG#v}" --generate-notes

  publish:
    needs: release
    uses: ractive/release-workflows/.github/workflows/chrome-extension-publish.yml@ea1fdf1ab5602ac55fa78f2d10e65d9dc4d5cd24 # v0.6.0
    # The job runs in the environment chrome-web-store, whose secrets a
    # reusable workflow sees only when the caller passes them on: inherit
    # (the repository has no secrets of its own, so only the environment's).
    secrets: inherit
    permissions:
      contents: read
      # gh attestation verify reads the zip's attestation.
      attestations: read
    with:
      tag: ${{ github.ref_name }}
      asset: sitegloss-{version}-store.zip
      extension-id: ldmcfigcnobhnbaigehcaodheklibeon
      attest-signer-workflow: .github/workflows/release.yml
      # The CRX id of CWS_CRX_PRIVATE_KEY, whose public key the item has under
      # "Verified CRX uploads" (kb/operations/chrome-web-store.md).
      signing-key-id: fhagiknobniheomfcadmfdpanogmpmka

  publish-edge:
    # Beside the Chrome Web Store job, not after it: one store's failure does
    # not hold back the other. Each waits for the owner's approval in its own
    # environment.
    needs: release
    uses: ractive/release-workflows/.github/workflows/edge-extension-publish.yml@f1fde0fc2dfb016201659084f5d9d4f2ad2cea5a # v0.7.0
    # The environment edge-add-ons (required reviewer, tags v* only) holds
    # EDGE_CLIENT_ID and EDGE_API_KEY; inherit passes them on, as above.
    secrets: inherit
    permissions:
      contents: read
      attestations: read
    with:
      tag: ${{ github.ref_name }}
      asset: sitegloss-{version}-store.zip
      # The Edge Add-ons item (its Product ID; the CRX id is
      # odheabckckkaclenpbbdkpkjjfmbnalo, which the hosted relay allows).
      product-id: 5c87cd72-07f3-427a-a433-edcd7c08eff4
      attest-signer-workflow: .github/workflows/release.yml
      notes: >-
        Open any web page and click the Sitegloss toolbar icon: the side panel opens. "New case
        for this page" shows a toolbar on the page (Element, Box, Arrow, Pen, Note); each mark
        takes a comment and is saved to the case with a screenshot. Clicking the case on the
        same page later draws the marks on it again. Connecting an AI app is optional: the
        side panel's AI section uses the hosted tab-mcp relay and shows an address and a
        pairing code for an MCP client. Source: https://github.com/ractive/sitegloss; the
        package is the release zip of tag ${{ github.ref_name }}, with GitHub build
        provenance (gh attestation verify <zip> -R ractive/sitegloss).

  publish-firefox:
    # Beside the other two, not after them: one store's failure does not hold
    # back the others. Waits for the owner's approval in its own environment.
    needs: release
    uses: ractive/release-workflows/.github/workflows/firefox-extension-publish.yml@d69f242378f228560fdf2fb7ce851c2d8fb6a11e # v0.8.1
    # The environment firefox-add-ons (required reviewer, tags v* only) holds
    # AMO_JWT_ISSUER and AMO_JWT_SECRET; inherit passes them on, as above.
    secrets: inherit
    permissions:
      contents: read
      attestations: read
    with:
      tag: ${{ github.ref_name }}
      asset: sitegloss-firefox-{version}-store.zip
      source-asset: sitegloss-{version}-source.zip
      addon-id: sitegloss@ractive.ch
      attest-signer-workflow: .github/workflows/release.yml
      notes: >-
        Open any web page and click the Sitegloss toolbar icon: the sidebar opens. "New case
        for this page" shows a toolbar on the page (Element, Box, Arrow, Pen, Note); each mark
        takes a comment and is saved to the case with a screenshot. Clicking the case on the
        same page later draws the marks on it again. Connecting an AI app is optional: it is
        off until the user turns it on in the sidebar's AI section and consents to the data
        collection Firefox asks about; it then uses the hosted tab-mcp relay and shows an
        address and a pairing code for an MCP client. The code is bundled with Bun and not
        minified. To build the uploaded zip from the attached source: Bun 1.4.4
        (https://bun.sh), then in the unpacked archive `bun install --frozen-lockfile` and
        `bun scripts/build.ts --firefox --store --zip`, which makes
        sitegloss-firefox-<version>-store.zip (the version is package.json's; the build is
        reproducible, the zip has the same SHA-256). Source and the README's build section:
        https://github.com/ractive/sitegloss; the package is the release zip of tag
        ${{ github.ref_name }}, with GitHub build provenance
        (gh attestation verify <zip> -R ractive/sitegloss).
