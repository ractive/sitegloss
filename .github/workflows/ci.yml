name: CI

# On every pull request and push to main: Biome, the type check, the unit
# tests and the smoke set of the end-to-end tests (bun run verify, DEC-053),
# then the packages. The full end-to-end sets, Chromium's and Firefox's, run
# in e2e.yml: nightly, on a release tag, and by hand.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Chrome for Testing, pinned so a Chrome release cannot change a run; bump it
  # on purpose. Branded Chrome ignores --load-extension, so the extension tests
  # need Chrome for Testing.
  CHROME_VERSION: "156.0.8078.80"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
      - run: bun install --frozen-lockfile
      # Biome, the type check, the unit tests and the end-to-end smoke set.
      - run: bun run verify
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      # The packages of this commit, downloadable from the run's page: the
      # extension with the fixed key for "Load unpacked", the store package,
      # and the Firefox build's package for addons.mozilla.org.
      - run: bun scripts/build.ts --zip
      - run: bun scripts/build.ts --store --zip --outdir dist-store
      - run: bun scripts/build.ts --firefox --store --zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitegloss-unpacked
          path: |
            sitegloss-*.zip
            !sitegloss-*-store.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitegloss-store
          path: |
            sitegloss-*-store.zip
            !sitegloss-firefox-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitegloss-firefox-store
          path: sitegloss-firefox-*-store.zip
          if-no-files-found: error
