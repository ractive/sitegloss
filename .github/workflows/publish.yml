name: Publish to the stores

# Publishes the store zip of a GitHub release to the Chrome Web Store or
# Microsoft Edge Add-ons or addons.mozilla.org by hand: the jobs release.yml runs after it creates the
# release, for a release whose publish failed or was rejected. Actions →
# Publish to the stores → Run workflow, pick the release's tag under "Use
# workflow from" (a run from a branch fails) and the store.
#
# ractive/release-workflows chrome-extension-publish.yml (DEC-032),
# edge-extension-publish.yml (DEC-033) and firefox-extension-publish.yml
# (DEC-035): only a zip whose build provenance
# verifies (signed by release.yml for this tag); for Chrome as a CRX signed
# with the item's verified-upload key, from the environment chrome-web-store;
# for Edge the zip, from the environment edge-add-ons; for Firefox the Firefox
# store zip with the source archive, from the environment firefox-add-ons.
# Setup: kb/operations/chrome-web-store.md, kb/operations/firefox-add-ons.md.

on:
  workflow_dispatch:
    inputs:
      store:
        description: "The store to publish to"
        type: choice
        options: [chrome, edge, firefox, all]
        default: chrome
      submit:
        description: "Submit for review after the upload (otherwise it stays a draft in the store's dashboard). Chrome and Edge only: addons.mozilla.org has no draft, a Firefox version is always submitted"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    if: inputs.store == 'chrome' || inputs.store == 'all'
    uses: ractive/release-workflows/.github/workflows/chrome-extension-publish.yml@ea1fdf1ab5602ac55fa78f2d10e65d9dc4d5cd24 # v0.6.0
    # The job runs in the environment chrome-web-store, whose secrets a
    # reusable workflow sees only when the caller passes them on: inherit
    # (the repository has no secrets of its own, so only the environment's).
    secrets: inherit
    permissions:
      contents: read
      attestations: read
    with:
      tag: ${{ github.ref_name }}
      asset: sitegloss-{version}-store.zip
      extension-id: ldmcfigcnobhnbaigehcaodheklibeon
      attest-signer-workflow: .github/workflows/release.yml
      signing-key-id: fhagiknobniheomfcadmfdpanogmpmka
      submit: ${{ inputs.submit }}

  publish-edge:
    if: inputs.store == 'edge' || inputs.store == 'all'
    uses: ractive/release-workflows/.github/workflows/edge-extension-publish.yml@e481d39debc964c304c97327982d28431bc9604a # v0.8.2
    secrets: inherit
    permissions:
      contents: read
      attestations: read
    with:
      tag: ${{ github.ref_name }}
      asset: sitegloss-{version}-store.zip
      product-id: 5c87cd72-07f3-427a-a433-edcd7c08eff4
      attest-signer-workflow: .github/workflows/release.yml
      submit: ${{ inputs.submit }}
      # The same notes for certification as release.yml's.
      notes: >-
        Open any web page and click the Sitegloss icon (under the puzzle piece until
        pinned) or press Alt+Shift+O: the side panel opens. "New case for this page" shows
        a toolbar on the page (Element, Box, Arrow, Pen, Highlight, Note); each mark takes
        a comment and is saved to the case with a screenshot. Opening the case on the same
        page later draws the marks on it again. Access to all sites is optional: the panel
        offers it and the browser asks in the click; without it Sitegloss runs on a tab
        after the icon's click. Everything above works without an account. Optional:
        signing in to a team ("Sign in" in the panel's Team section; it needs a free
        account at app.sitegloss.dev/sign-up with a confirmed e-mail address), and
        connecting an AI app through the hosted tab-mcp relay (an address and a pairing
        code in the panel's AI section; every change the app wants is asked first, unless
        the user chose Always allow or Allow all changes). Bundled: tab-mcp-client 0.24.0 with
        its WebMCP mirror off, tldts 7.5.5 with the public suffix list as data, and two
        font files (SIL OFL); licences in LICENSES.txt. No remote code, no analytics.
        Source: https://github.com/ractive/sitegloss; the package is the release zip of
        tag ${{ github.ref_name }}, with GitHub build provenance
        (gh attestation verify <zip> -R ractive/sitegloss).

  publish-firefox:
    if: inputs.store == 'firefox' || inputs.store == 'all'
    uses: ractive/release-workflows/.github/workflows/firefox-extension-publish.yml@d69f242378f228560fdf2fb7ce851c2d8fb6a11e # v0.8.1
    secrets: inherit
    permissions:
      contents: read
      attestations: read
    with:
      tag: ${{ github.ref_name }}
      asset: sitegloss-firefox-{version}-store.zip
      source-asset: sitegloss-{version}-source.zip
      addon-id: sitegloss@ractive.ch
      attest-signer-workflow: .github/workflows/release.yml
      # The same notes for the reviewers as release.yml's.
      notes: >-
        Open any web page and click Sitegloss under the puzzle piece (or its icon, if
        pinned) or press Alt+Shift+O: the sidebar opens. "New case for this page" shows a
        toolbar on the page (Element, Box, Arrow, Pen, Highlight, Note); each mark takes a
        comment and is saved to the case with a screenshot. Opening the case on the same
        page later draws the marks on it again. Access to all sites is optional: the
        sidebar offers it and Firefox asks in the click. Connecting an AI app and signing
        in to a team at app.sitegloss.dev (a free account with a confirmed e-mail address)
        are optional and off until the user turns them on; each first asks for the data
        collection consent Firefox shows (website content, browsing activity). Every change
        an AI app wants is asked first, unless the user chose Always allow or Allow all
        changes. Bundled: tab-mcp-client 0.24.0 with its WebMCP
        mirror off (webmcp: false), tldts 7.5.5 with the public suffix list as data (no
        network), two font files in fonts/ (SIL OFL 1.1); licences in LICENSES.txt.
        src/lib/cloud/api.gen.ts is generated by bun scripts/api-types.ts from
        src/lib/cloud/openapi-v1.json. The code is bundled with Bun and not minified. To
        build the uploaded zip from the attached source: Bun 1.4.4 (https://bun.sh), then
        in the unpacked archive `bun install --frozen-lockfile` and
        `bun scripts/build.ts --firefox --store --zip`, which makes
        sitegloss-firefox-<version>-store.zip (the version is package.json's; the build is
        reproducible, the zip has the same SHA-256). Source and the README's build section:
        https://github.com/ractive/sitegloss; the package is the release zip of tag
        ${{ github.ref_name }}, with GitHub build provenance
        (gh attestation verify <zip> -R ractive/sitegloss).
