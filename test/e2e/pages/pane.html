<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pane</title>
<style>
	html, body { margin: 0; font: 20px sans-serif; }
	#head { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #222; color: #fff; z-index: 1; }
	#account { position: absolute; top: 12px; right: 16px; }
	#pane { position: fixed; top: 60px; left: 0; right: 0; bottom: 0; overflow: auto; }
	#band { position: sticky; top: 0; height: 40px; background: #ddd; z-index: 1; }
	.block { width: 600px; height: 200px; margin: 40px; color: #fff; background: rgb(0, 120, 255); }
	#rest { height: 2000px; }
</style>
</head>
<body>
<header id="head">Head <button type="button" id="account">Account</button></header>
<main id="pane">
	<div id="band">Filters</div>
	<div class="block" id="first">First</div>
	<div id="rest"></div>
</main>
</body>
</html>
